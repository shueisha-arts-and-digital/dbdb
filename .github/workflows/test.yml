name: Test

on:
  push:
    # タグ push では paths が評価されず常に起動するため、ブランチ push に限定する
    branches:
      - '**'
    # 動作に関係するファイルが変わったときだけ実行する（VERSION・*.md・skills/** だけの変更では走らない）
    paths:
      - '**/*.sh'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - '!**/*.md'
      - '!skills/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # 1 つの失敗で他の組み合わせを止めず、動かないバージョンをまとめて洗い出す
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        test_script: [
          help.sh,
          mongodb-6.0.24.sh,
          mongodb-7.0.21.sh,
          mysql-8.0.42.sh,
          mysql-8.4.4.sh,
          postgresql-12.6.sh,
          postgresql-13.2.sh,
          redis-6.2.14.sh,
          redis-7.2.5.sh,
          memcached-1.6.31.sh
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install database dependencies
        if: runner.os == 'Linux'
        run: |
          # MySQL は libaio.so.1 を要求するが、Ubuntu 24.04 以降は t64 移行で libaio.so.1t64 という名前になっている
          sudo apt-get update
          sudo apt-get install -y libaio1t64 libnuma1 libmecab2 libssl3t64 libncurses6 libtinfo6
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          sudo ldconfig
          # PostgreSQL は Linux ではソースからビルドするため、configure が既定で要求する readline と zlib の開発用パッケージが要る
          sudo apt-get install -y libreadline-dev zlib1g-dev

      # WARNING Memory overcommit must be enabled! Without it,
      # a background save or replication may fail under low memory condition. Being disabled,
      # it can also cause failures without low memory condition,
      # see https://github.com/jemalloc/jemalloc/issues/1328.
      # To fix this issue add 'vm.overcommit_memory = 1' to /etc/sysctl.conf and then reboot
      # or run the command 'sysctl vm.overcommit_memory=1' for this to take effect.
      - name: Enable memory overcommit
        if: runner.os == 'Linux'
        run: |
          sudo sysctl vm.overcommit_memory=1

      - name: Run test
        run: |
          cd tests
          /bin/bash ${{ matrix.test_script }}
